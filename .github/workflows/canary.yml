name: canary

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: image/go.mod
          cache-dependency-path: image/go.sum
      - name: go version
        run: go version

  report:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open / comment / close the CI tracking issue
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.test.result }}
        with:
          script: |
            core.info('report scaffolding ok ' + process.env.BUILD_RESULT)
